name: assistente-ubs-marilia
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: automacao
      POSTGRES_USER: automacao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automacao -d automacao"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://automacao:${POSTGRES_PASSWORD}@db:5432/automacao
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: '1536'
      SOURCES_CONFIG: /app/sources.json
    volumes:
      - ./sources.json:/app/sources.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    networks: [private]

volumes:
  postgres_data:
  # Volume historico do n8n anterior: reservado, nao montado nem removido.
  n8n_data:

networks:
  private:
    driver: bridge

limit_req_zone $binary_remote_addr zone=chat_ubs:10m rate=12r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" always;

    location = /api/chat {
        limit_req zone=chat_ubs burst=5 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://n8n:5678/webhook/ubs-marilia;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 105s;
    }
    location = /api/status {
        limit_except GET { deny all; }
        proxy_pass http://api:8000/internal/status;
        proxy_read_timeout 10s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
}

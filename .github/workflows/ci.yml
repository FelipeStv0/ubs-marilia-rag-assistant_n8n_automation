name: Continuous Integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Python syntax check
        run: python -m compileall -q api/app scripts tests
      - name: Unit and n8n static contract tests
        run: python -m pytest -q tests/ --ignore=tests/integration --junitxml=unit-tests.xml
      - name: Validate JSON files
        run: |
          python -m json.tool sources.json >/dev/null
          python -m json.tool workflows/01-atualizacao-fontes.json >/dev/null
          python -m json.tool workflows/02-perguntas-rag.json >/dev/null
      - name: Audit tracked credential paths without reading secrets
        run: python scripts/auditar_segredos.py --ci
      - name: Verify no committed secrets
        run: |
          ! git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|(^|/)n8n_data/'
      - name: Retain unit-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-tests.xml
          if-no-files-found: ignore

  fastapi-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: automacao
          POSTGRES_USER: automacao
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automacao -d automacao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://automacao:ci_test_only@localhost:5432/automacao
      OPENAI_API_KEY: ''
      RUN_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Initialize PostgreSQL with pgvector
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
              for sql in Path("db/init.sql").read_text(encoding="utf-8").split(";"):
                  if sql.strip():
                      conn.execute(sql)
          PY
      - name: Exercise FastAPI against actual PostgreSQL
        run: python -m pytest -q tests/integration --junitxml=integration-tests.xml
      - name: Retain integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-postgres-integration-results
          path: integration-tests.xml
          if-no-files-found: ignore

name: Continuous Integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Python syntax check
        run: python -m compileall -q api/app scripts
      - name: Run tests
        run: python -m pytest -q tests/
      - name: Validate JSON files
        run: |
          python -m json.tool sources.json >/dev/null
          python -m json.tool workflows/01-atualizacao-fontes.json >/dev/null
          python -m json.tool workflows/02-perguntas-rag.json >/dev/null
      - name: Verify no committed secrets
        run: |
          ! git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|(^|/)n8n_data/'
